# Beveiligingsscan van de workflows (bijvoorbeeld injectie via ${{ }} of te ruime rechten) en de scripts.
# Bevindingen staan onder Security → Code scanning.
name: Beveiligingsscan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1' # elke maandag, ook als er niets verandert (nieuwe regels in CodeQL)

permissions:
  contents: read

jobs:
  scan:
    name: CodeQL (${{ matrix.taal }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read # alleen lezen
      security-events: write # resultaten naar Security → Code scanning
    strategy:
      fail-fast: false
      matrix:
        taal: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.taal }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /taal:${{ matrix.taal }}
