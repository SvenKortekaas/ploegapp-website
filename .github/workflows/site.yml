# Bouwt en publiceert ploegapp.nl.
#  1. Haalt de nieuwste versie van de (privé) app op met een alleen-lezen token. De app komt NOOIT
#     in deze repo of in de gepubliceerde site: hij staat alleen tijdelijk op de runner in app/.
#  2. Start de app met een lege database, vult die met fictieve gegevens en maakt screenshots.
#  3. Bouwt de statische site en controleert hem: geen cookies, geen scripts, geen externe verzoeken,
#     alleen html/css/png/svg/txt.
#  4. Alleen vanaf main: publiceren naar GitHub Pages.
# Mislukt een stap, dan blijft de vorige versie van de site gewoon online.
#
# Eenmalig nodig: secret PLOEGAPP_LEES_TOKEN (fine-grained token, alleen de repo ploegapp,
# alleen "Contents: read"). Zie README.md. Verloopt het binnen twee weken, dan komt er een issue.
name: Site bouwen en publiceren

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Elke nacht: nieuwste app, verse screenshots (datums in de voorbeelden lopen mee).
    # GitHub slaat geplande runs soms over of start ze uren later; daarom drie tijdstippen (UTC).
    - cron: '17 3 * * *'
    - cron: '41 9 * * *'
    - cron: '23 15 * * *'
  repository_dispatch:
    types: [app-bijgewerkt] # optioneel: de app-repo kan dit sturen na een uitrol

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bouwen:
    name: Screenshots, bouwen en controleren
    runs-on: ubuntu-24.04
    # Deze job draait code van buiten (de app en npm-pakketten) en mag daarom alleen lezen.
    # Schrijven (issue, geplande run) gebeurt in de job "bijhouden", die geen vreemde code draait.
    permissions:
      contents: read
    outputs:
      dekking: ${{ steps.dekking.outputs.rapport }}
      token_verloopt: ${{ steps.token.outputs.dagen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vangnet: er mag nooit code van de app in deze publieke repo staan
      - name: Geen app-code in deze repo
        run: |
          if git ls-files | grep -E '^(app/|\.app/|server\.js$|lib/|routes/|public/|test/|test-e2e/|Dockerfile$|fly\.toml$)'; then
            echo "::error::Bovenstaande bestanden horen bij de app en mogen niet in deze repo staan."
            exit 1
          fi

      - name: Token aanwezig? En verloopt hij niet binnenkort?
        id: token
        env:
          TOKEN: ${{ secrets.PLOEGAPP_LEES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret PLOEGAPP_LEES_TOKEN ontbreekt (zie README.md, 'Eenmalig instellen')."
            exit 1
          fi
          # GitHub geeft de vervaldatum mee als header bij elk verzoek met het token
          KOPPEN=$(curl -s -D - -o /dev/null -H "Authorization: Bearer $TOKEN" https://api.github.com/rate_limit | tr -d '\r') || true
          VERVALT=$(printf '%s\n' "$KOPPEN" | sed -n 's/^github-authentication-token-expiration: //Ip')
          if [ -z "$VERVALT" ]; then
            echo "Geen vervaldatum gevonden ($(printf '%s\n' "$KOPPEN" | head -1)): token zonder vervaldatum?"
          else
            DAGEN=$(( ($(date -d "$VERVALT" +%s) - $(date +%s)) / 86400 ))
            echo "Token verloopt over $DAGEN dagen."
            if [ "$DAGEN" -lt 14 ]; then echo "dagen=$DAGEN" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Nieuwste app ophalen (alleen op de runner, niet in de repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/ploegapp
          token: ${{ secrets.PLOEGAPP_LEES_TOKEN }}
          path: app
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # --ignore-scripts: installatiescripts van npm-pakketten draaien niet (geen van de pakketten heeft ze nodig)
      - name: Afhankelijkheden
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix app --omit=dev --ignore-scripts --no-audit --no-fund --silent

      - name: Werkt de privacycontrole zelf nog? (test)
        run: npm test

      # De runner mist een lettertype met het ⓘ-teken van de app; anders staat er een leeg vakje
      - name: Lettertype voor de screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-freefont-ttf

      - name: Screenshots maken (fictieve gegevens)
        run: npm run screenshots

      - name: Site bouwen
        run: npm run bouw

      - name: Controleren (privacy, links, opmaak)
        env:
          VERBODEN_WOORDEN: ${{ secrets.VERBODEN_WOORDEN }}
        run: npm run controleer

      - name: Staan alle functies van de app op de site?
        id: dekking
        run: |
          node scripts/dekking.js
          if [ -f .tmp/dekking.md ]; then echo "rapport=$(base64 -w0 .tmp/dekking.md)" >> "$GITHUB_OUTPUT"; fi

      # Alleen de gebouwde site gaat mee; app/ en .beelden/ niet
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: uit

  bijhouden:
    name: Issue en geplande run bijhouden
    needs: bouwen
    # Altijd op main: ook om het issue te sluiten zodra alle functies op de site staan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      issues: write   # issue bij een nieuwe functie zonder uitleg, of als het token bijna verloopt
      actions: write  # geplande run actief houden
    steps:
      # Op exacte titel zoeken, niet met --search: die zoekindex loopt achter en dan kwam er elke run een nieuw issue bij
      - name: Issue bij een nieuwe functie zonder uitleg (en sluiten als alles erop staat)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RAPPORT: ${{ needs.bouwen.outputs.dekking }}
        run: |
          TITEL="Nieuwe functie(s) in de app zonder uitleg op de site"
          NRS=$(gh issue list --state open --limit 200 --json number,title --jq ".[] | select(.title == \"$TITEL\") | .number" | sort -n)
          if [ -z "$RAPPORT" ]; then
            for NR in $NRS; do gh issue close "$NR" --reason completed --comment "Alle functies van de app staan op de site."; done
            exit 0
          fi
          printf '%s' "$RAPPORT" | base64 -d > dekking.md
          EERSTE=$(echo "$NRS" | head -n1)
          if [ -n "$EERSTE" ]; then gh issue edit "$EERSTE" --body-file dekking.md
          else gh issue create --title "$TITEL" --body-file dekking.md; fi

      - name: Issue als het token binnen twee weken verloopt
        if: needs.bouwen.outputs.token_verloopt != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DAGEN: ${{ needs.bouwen.outputs.token_verloopt }}
        run: |
          TITEL="Token PLOEGAPP_LEES_TOKEN vernieuwen"
          TEKST="Het token verloopt over $DAGEN dagen. Daarna kan de workflow de app niet meer ophalen en blijven de oude screenshots op de site staan. Maak een nieuw token (README.md, 'Eenmalig instellen', stap 1), zet het bij de secrets voor Actions en voor Dependabot, en sluit dit issue."
          NR=$(gh issue list --state open --limit 200 --json number,title --jq "[.[] | select(.title == \"$TITEL\")][0].number // empty")
          if [ -n "$NR" ]; then gh issue edit "$NR" --body "$TEKST"
          else gh issue create --title "$TITEL" --body "$TEKST"; fi

      # GitHub zet geplande runs in publieke repo's uit na 60 dagen zonder activiteit; dit houdt ze aan
      - name: Geplande run actief houden
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/$GH_REPO/actions/workflows/site.yml/enable" || true

  publiceren:
    name: Publiceren op GitHub Pages
    needs: bouwen
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write     # publiceren
      id-token: write  # bewijs voor GitHub Pages dat de uitrol uit deze workflow komt
    environment:
      name: github-pages
      url: ${{ steps.uitrol.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: uitrol
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
