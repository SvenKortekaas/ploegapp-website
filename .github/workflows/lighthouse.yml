# Meet de live site met Lighthouse (het meetprogramma van Google), na het publiceren als pagina's of opmaak
# veranderden (site.yml roept deze workflow aan), of met de hand: vindbaarheid (SEO),
# toegankelijkheid en goede praktijken moeten 100 zijn, snelheid minimaal 90. Zakt er iets, dan wordt
# deze workflow rood en stuurt GitHub de eigenaar een mail. Zie scripts/lighthouse.js.
# Lighthouse staat vast op een versie in .github/lighthouse/ (met lockfile); Dependabot houdt hem bij.
name: Lighthouse

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meten:
    name: Lighthouse op ploegapp.nl
    runs-on: ubuntu-24.04
    permissions:
      contents: read # alleen lezen; geen secrets nodig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Lighthouse installeren (vaste versie, zonder installatiescripts)
        run: npm ci --prefix .github/lighthouse --ignore-scripts --no-audit --no-fund
      - name: Meten
        env:
          LIGHTHOUSE: .github/lighthouse/node_modules/.bin/lighthouse
        run: node scripts/lighthouse.js https://ploegapp.nl/
