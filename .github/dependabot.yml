# Houdt de GitHub-acties (vastgepind op een commit) en het npm-pakket automatisch actueel.
# Dependabot opent een pull request; de controles draaien daarop, de eigenaar merget.
# cooldown: een nieuwe versie pas na een week voorstellen. Een gekaapte versie is dan meestal al
# ontdekt en ingetrokken (beveiligingsupdates komen wel meteen).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      acties:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /.github/lighthouse
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
